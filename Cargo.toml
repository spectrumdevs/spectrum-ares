[package]
name = "spectrum-ares"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Linux-first Spotify audio analysis library for Spectrum Client visualizers."
repository = "https://github.com/Cypphi/spectrum-ares"

[lib]
name = "spectrum_ares"
crate-type = ["cdylib"]

[dependencies]
ctrlc = "3.4.5"
pipewire = "0.9.2"
rustfft = "6.2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
